name: Build and runtime self-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test generic combat calculations
        run: npm run combat:primitives:self-test

      - name: Test generic combat actor model
        run: npm run combat:model:self-test

      - name: Test generic package combat actions
        run: npm run combat:packages:self-test

      - name: Test generic inventory runtime
        run: npm run inventory:runtime:self-test

      - name: Test transient script object cleanup
        run: npm run script-objects:cleanup:self-test

      - name: Test generic projectile visuals
        run: npm run projectiles:visual:self-test

      - name: Test generic combat action scheduler
        run: npm run combat:scheduler:self-test

      - name: Test generic game-module lifecycle
        run: npm run game:modules:self-test

      - name: Test autonomous behaviors
        run: npm run behavior:autonomous:self-test

      - name: Test declarative behavior-package scripts
        run: npm run behavior:package-scripts:self-test

      - name: Test behavior-package import drafts
        run: npm run behavior:packages:self-test

      - name: Test cooldown scheduler
        run: npm run cooldown:scheduler:self-test

      - name: Test finite state machine
        run: npm run state-machine:self-test

      - name: Test world tag registry
        run: npm run world:tags:self-test

      - name: Test generic resource pool
        run: npm run resource:pool:self-test

      - name: Test owner-scoped resource registry
        run: npm run resource:pools:self-test

      - name: Test 3D spatial hash
        run: npm run spatial:hash:self-test

      - name: Test generic trigger volumes
        run: npm run trigger:volume:self-test

      - name: Test interaction target selection
        run: npm run interaction:target:self-test

      - name: Test composed gameplay world systems
        run: npm run gameplay:world:self-test

      - name: Test integrated interaction runtime
        run: npm run interaction:runtime:self-test

      - name: Test extensible behavior tree handlers
        run: npm run behavior:handlers:self-test

      - name: Test generic behavior tree package runtime
        run: npm run behavior:tree-runtime:self-test

      - name: Test generic behavior tree interpreter
        run: npm run behavior:tree:self-test

      - name: Test behavior tree package lifecycle
        run: npm run behavior:tree-package:self-test

      - name: Test generic navigation pathfinder
        run: npm run navigation:pathfinder:self-test

      - name: Test generic event bus
        run: npm run events:bus:self-test

      - name: Test game and engine separation
        run: npm run game:separation:self-test

      - name: Test generic status effects
        run: npm run status:effects:self-test

      - name: Test objective progression tracker
        run: npm run objectives:tracker:self-test

      - name: Test gameplay behavior extension composition
        run: npm run gameplay:behavior-extensions:self-test

      - name: Test gameplay runtime composition
        run: npm run gameplay:runtime:self-test

      - name: Test generic entity component lifecycle
        run: npm run entity:components:self-test

      - name: Test generic entity behavior lifecycle
        run: npm run entity:behaviors:self-test

      - name: Test entity behavior module integration
        run: npm run entity:game-module:self-test

      - name: Test component-filtered entity systems
        run: npm run entity:systems:self-test

      - name: Test cached generic entity queries
        run: npm run entity:queries:self-test

      - name: Test generic entity batch processing
        run: npm run entity:batches:self-test

      - name: Test deferred generic entity commands
        run: npm run entity:commands:self-test

      - name: Test visual UI screen definitions
        run: npm run ui-workspace:self-test

      - name: Test generic runtime phase pipeline
        run: npm run runtime:phases:self-test
