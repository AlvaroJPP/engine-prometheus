name: Validate Engine Prometheus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test rig similarity diagnostic
        run: npx tsx scripts/analyze-rig-similarity.mjs --self-test
      - name: Test adaptive rigging
        run: npx tsx scripts/rigging-self-test.mjs
      - name: Test model import visual states
        run: npx tsx scripts/import-model-states-self-test.mjs
      - name: Test animation role options and bindings
        run: npx tsx scripts/animation-role-options-self-test.mjs
      - name: Test retarget rest pose cache
        run: npx tsx scripts/retarget-rest-pose-self-test.mjs
      - name: Test model renderable mesh restoration
        run: npx tsx scripts/model-renderable-meshes-self-test.mjs
      - name: Test model collider sizing
        run: npx tsx scripts/model-collider-sizing-self-test.mjs
      - name: Test model preview animation runtime
        run: npx tsx scripts/model-preview-animation-runtime-self-test.mjs
      - name: Test model base-color texture repair
        run: npx tsx scripts/model-color-texture-repair-self-test.mjs
      - name: Test model spatial measurements
        run: npx tsx scripts/model-spatial-measurements-self-test.mjs
      - name: Test model import normalization
        run: npx tsx scripts/model-import-normalization-self-test.mjs
      - name: Test model preview selection and visibility
        run: npx tsx scripts/model-preview-selection-self-test.mjs
      - name: Test model-owned Object URLs
        run: npx tsx scripts/model-owned-object-urls-self-test.mjs
      - name: Test model collider preview
        run: npx tsx scripts/model-collider-preview-self-test.mjs
      - name: Test imported model resource cleanup
        run: npx tsx scripts/model-import-resource-cleanup-self-test.mjs
      - name: Test import behavior package config
        run: npx tsx scripts/import-behavior-package-config-self-test.mjs
      - name: Test rig keyframe timeline
        run: npx tsx scripts/rig-keyframe-timeline-self-test.mjs
      - name: Type-check and build
        run: cd ep-work && npm run build
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check Tauri Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml