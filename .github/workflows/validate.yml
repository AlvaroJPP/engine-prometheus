name: Validate Engine Prometheus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test rig similarity diagnostic
        run: npm run rig:similarity:self-test
      - name: Test adaptive rigging
        run: npm run rigging:self-test
      - name: Test model import visual states
        run: npm run model:states:self-test
      - name: Test animation role options and bindings
        run: npm run animation:roles:self-test
      - name: Test import behavior package drafts
        run: npm run behavior:packages:self-test
      - name: Test retarget rest pose cache
        run: npm run retarget:rest-pose:self-test
      - name: Test model renderable mesh restoration
        run: npm run animation:renderable-meshes:self-test
      - name: Type-check and build
        run: npm run build
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check Tauri Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
