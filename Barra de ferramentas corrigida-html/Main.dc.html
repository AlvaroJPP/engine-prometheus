<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prometeu Engine – Barra de ferramentas</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:#f3efe6;font:500 13px/1 'IBM Plex Sans',sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{background:#26231e}
.btn:focus-visible,.fld:focus-visible{outline:2px solid #e8572b;outline-offset:2px}
.sq{width:36px;padding:0;justify-content:center}
.mut{color:#b5afa2}
.sel,.sel:hover{background:#34302a;color:#f3efe6}
.on,.on:hover{background:#e8572b;color:#14120f}
.sep{width:1px;height:24px;background:#2e2b25;flex:none}
</style>
</helmet>
<div style="width:1280px;height:360px;background:#14120f;font-family:'IBM Plex Sans',sans-serif;color:#f3efe6">
<header style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;height:56px;padding:0 12px;box-sizing:border-box;background:#14120f;border-bottom:1px solid #2e2b25">
<div style="display:flex;align-items:center;gap:8px;min-width:0">
<button class="btn sq" aria-label="Prometeu Engine" title="Prometeu Engine"><img src="./assets/667782bcc4af97570dbb7151f4a58593.png" alt="" style="width:32px;height:32px;display:block"></button>
<div class="sep"></div>
<div style="display:flex;align-items:center;height:36px;border:1px solid #2e2b25;border-radius:8px;background:#1d1b17">
<input class="fld" aria-label="Nome do projeto" value="mundo medieval" style="width:148px;height:34px;box-sizing:border-box;padding:0 12px;border:0;border-radius:8px 0 0 8px;background:transparent;color:#f3efe6;font:500 13px 'IBM Plex Sans',sans-serif">
<div class="sep" style="height:20px"></div>
<button class="btn mut" style="border-radius:0 8px 8px 0">Arquivo
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></button>
</div>
<button class="btn" style="border-color:#2e2b25;background:#1d1b17">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h8l2 2v8H3z"></path><path d="M5 3v4h5V3M5 13V9h6v4"></path></svg>Salvar</button>
</div>
<div role="group" aria-label="Modo" style="display:flex;align-self:stretch;gap:8px">
<button class="btn" aria-pressed="true" style="height:100%;padding:0 16px;border-radius:0;border-bottom:2px solid #e8572b;border-right:2px solid #e8572b;background:transparent;color:#f3efe6">
<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l1-3.5L11 2.5l2.5 2.5-7 7z"></path></svg>Editar</button>
<button class="btn mut" aria-pressed="false" style="height:100%;padding:0 16px;border-radius:0;border-bottom:2px solid transparent">
<svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.5 3v10l8-5z"></path></svg>Jogar</button>
</div>
<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0">
<label style="display:flex;align-items:center;gap:8px;flex:0 1 260px;min-width:150px;height:36px;box-sizing:border-box;padding:0 8px 0 12px;border:1px solid #2e2b25;border-radius:8px;background:#1d1b17;color:#b5afa2">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
<input class="fld" placeholder="Pesquisar…" style="flex:1;min-width:0;border:0;background:transparent;color:#f3efe6;font:400 13px 'IBM Plex Sans',sans-serif">
<span style="flex:none;padding:3px 7px;border:1px solid #e8572b;border-radius:5px;background:#14120f;font-size:11px;font-weight:500;color:#f3efe6;white-space:nowrap">Ctrl K</span>
</label>
<div class="sep"></div>
<button class="btn" style="border-color:#2e2b25;background:#1d1b17">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 5h12M2 11h12"></path><circle cx="10" cy="5" r="1.6" fill="#1d1b17"></circle><circle cx="6" cy="11" r="1.6" fill="#1d1b17"></circle></svg>Controles</button>
</div>
</header>
<div style="position:relative;height:304px;background:linear-gradient(#7fa3de 0%,#c3d6f2 62%,#59673f 62%,#3f4a2d 100%)">
<div role="toolbar" aria-label="Visualização do mundo" style="position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px;padding:4px;border:1px solid #2e2b25;border-radius:12px;background:rgba(20,18,15,.88)">
<div role="group" aria-label="Câmera" style="display:flex;gap:2px">
<button class="btn mut" aria-pressed="false">1ª pessoa</button>
<button class="btn sel" aria-pressed="true">Câmera livre</button>
</div>
<div class="sep"></div>
<button class="btn">
<span style="width:8px;height:8px;border-radius:50%;background:#e8572b"></span>Render: Tudo
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></button>
<div class="sep"></div>
<button class="btn sq" aria-label="Tela cheia do mundo" title="Tela cheia do mundo">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6V3h3M10 3h3v3M13 10v3h-3M6 13H3v-3"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":360}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
